<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puslapis nerastas (404) — Promptų anatomija</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
                                                                                                                                                                                                                                                                                                                                                                                                /* DS_TOKENS_START — from styles\tokens-satellite.css; do not edit here */
        /* DS v2.1 — minimal :root for 404.html and tools.html (subset of styles/tokens.css) */
        :root {
            --primary-blue: #103b5a;
            --accent-yellow: #fbd304;
            --accent-red: #ff5a5f;
            --bg-dark: #071b29;
            --surface-base: var(--bg-dark);
            --surface-raised: rgba(255, 255, 255, 0.045);
            --surface-inset: rgba(0, 0, 0, 0.2);
            --border-hairline: rgba(255, 255, 255, 0.065);
            --border-subtle: rgba(255, 255, 255, 0.16);
            --text-bright: #f8fafc;
            --text-body: #e2e8f0;
            --text-muted: #cbd5e1;
            --text-soft: #94a3b8;
            --text-on-accent: #0a0a0a;
            --text-tertiary: rgba(255, 255, 255, 0.82);
            --text-secondary: rgba(255, 255, 255, 0.88);
            --text-on-dark-high: var(--text-tertiary);
            --brand-wordmark: #f1f5f9;
            --font-size-label: 13px;
            --font-size-ui: 14px;
            --tracking-label: 0.12em;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-main: 'Inter', sans-serif;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
            --duration-fast: 180ms;
            --duration-base: 220ms;
        }
        /* DS_TOKENS_END */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: var(--font-main);
            background: var(--surface-base);
            color: var(--text-bright);
            line-height: 1.5;
        }
        main {
            max-width: 28rem;
            text-align: center;
        }
        h1 {
            font-family: var(--font-display);
            font-size: clamp(1.25rem, 4vw, 1.5rem);
            font-weight: 700;
            margin: 0 0 12px;
        }
        p { margin: 0 0 20px; color: var(--text-muted); font-size: 1rem; }
        a.cta-primary {
            display: inline-block;
            color: var(--text-on-accent);
            background: var(--accent-yellow);
            font-weight: 700;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            transition: filter var(--duration-fast) var(--ease-out);
        }
        a.cta-primary:hover { filter: brightness(1.05); }
        a.cta-primary:focus-visible { outline: 2px solid var(--accent-yellow); outline-offset: 3px; }
        .sub { margin-top: 16px; font-size: 0.9rem; }
        .sub a {
            display: inline;
            background: none;
            color: var(--text-body);
            padding: 0;
            text-decoration: underline;
            font-weight: 600;
        }
        .sub a:hover { color: var(--text-bright); }
        .sub a:focus-visible { outline: 2px solid var(--accent-yellow); outline-offset: 3px; }
        .page-legal-footnote {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-hairline);
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .page-legal-footnote a { color: var(--text-body); }
    </style>
</head>
<body>
    <main>
        <h1>Puslapis nerastas</h1>
        <p>Šio adreso čia nėra. Grįžk į <a class="cta-primary" href="https://promptanatomy.cloud/">pamoką</a> arba į <a href="https://www.promptanatomy.app/" rel="noopener">www.promptanatomy.app</a> (brendas).</p>
        <p class="sub"><a href="./index.html">Atidaryti šį katalogą (index)</a></p>
        <footer class="page-legal-footnote" role="contentinfo">
            <p><strong>Prompt Anatomy</strong><br>1311 Park St, Unit #654 · Alameda, CA 94501<br><a href="mailto:info@promptanatomy.app">info@promptanatomy.app</a></p>
        </footer>
    </main>
</body>
</html>
