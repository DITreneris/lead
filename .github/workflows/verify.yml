name: Verify static files

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Required paths exist
        run: |
          test -f index.html
          test -f favicon.svg
          test -f 404.html
          test -f .github/workflows/pages.yml
          test -d assets
          test -f assets/www.promptanatomy.app.pdf
          test -f assets/www.promptanatomy.app-en.pdf
          test -f assets/prompt-library-en.js
          test -f package.json
          test -f scripts/build-locale-pages.js
          test -f scripts/generate-llms-artifacts.js
          test -f scripts/verify-library-keys.js
          test -f scripts/verify-en-locale.js
          test -f scripts/verify-robots-llms.js
          test -f scripts/verify-utm-canon.js
      - name: Build locale pages
        run: |
          set -euo pipefail
          npm install
          npm run build
      - name: Locale HTML checks
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/lt/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/llms.txt
          test -f site/llms-full.txt
          test -f site/pricing.md
          test -f site/security.txt
          test -f site/.well-known/security.txt
          test -f site/.well-known/agent.json
          test -f site/favicon.svg
          grep -q 'GPTBot' site/robots.txt
          grep -q 'OAI-SearchBot' site/robots.txt
          grep -q 'Claude-SearchBot' site/robots.txt
          grep -q 'Content-Signal' site/robots.txt
          test -f site/assets/prompt-library-en.js
          grep -q 'lang="lt"' site/lt/index.html
          grep -q 'lang="en"' site/index.html
          grep -q 'page-locale" content="en"' site/index.html
          grep -q 'hreflang="x-default"' site/index.html
          grep -q 'https://promptanatomy.cloud/' site/sitemap.xml
      - name: LT or EN drift checks
        run: |
          set -euo pipefail
          npm run verify
